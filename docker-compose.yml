version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowbot-postgres
    environment:
      POSTGRES_USER: flowbot
      POSTGRES_PASSWORD: flowbot_dev_password
      POSTGRES_DB: flowbot_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowbot']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowbot-network

  redis:
    image: redis:7-alpine
    container_name: flowbot-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flowbot-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowbot-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://flowbot:flowbot_dev_password@postgres:5432/flowbot_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flowbot_jwt_secret_min_32_characters_long_for_development
      JWT_REFRESH_SECRET: flowbot_refresh_secret_min_32_characters_long_for_development
      ENCRYPTION_KEY: flowbot_encryption_key_32_chars!!
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      WEB_URL: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowbot-network
    command: sh -c "cd apps/api && pnpm prisma:generate && pnpm prisma:migrate deploy && pnpm prisma:seed && pnpm start:dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowbot-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api
    networks:
      - flowbot-network
    command: pnpm --filter web dev

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  web_node_modules:
  web_next:

networks:
  flowbot-network:
    driver: bridge